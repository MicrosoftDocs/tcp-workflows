name: On-demand self publishing

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

on:
  issue_comment:
    types: [created]

jobs:

  # Pre-filter: only run when the comment contains a "#trusted-" command token, so the ~99% of PR
  # comments without a command never start a runner. Skip the workflow's own responder bot: its replies
  # embed the "#trusted-publish" token, which would otherwise re-trigger this job on every response.
  config:
    if: >-
      github.repository_owner == 'MicrosoftDocs'
      && contains(github.event.repository.topics, 'build')
      && github.event.issue.pull_request != null
      && contains(github.event.comment.body, '#trusted-')
      && github.event.comment.user.login != 'm365-skilling-repo-management[bot]'
    runs-on: ubuntu-latest
    outputs:
      EnableAfterHoursPublish: ${{ steps.read.outputs.EnableAfterHoursPublish }}
      EnableServicingPublish: ${{ steps.read.outputs.EnableServicingPublish }}
      AfterHoursAuthorizedTeam: ${{ steps.read.outputs.AfterHoursAuthorizedTeam }}
      ServicingAuthorizedTeam: ${{ steps.read.outputs.ServicingAuthorizedTeam }}
      ServicingAuthorizedApps: ${{ steps.read.outputs.ServicingAuthorizedApps }}
    steps:
      # Acknowledge receipt first, before checkout, so the submitter gets an instant "eyes" reaction while the
      # reusable workflow validates the command and authorization. Non-fatal - never block on this.
      - name: Acknowledge comment
        shell: pwsh
        env:
          CommentUrl: ${{ github.event.comment.url }}
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $Env:GitHubToken"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          # Post the "eyes" reaction. Wrapped in try/catch so a reaction failure never blocks processing.
          Try {
            $ReactionBody = @{ content = 'eyes' } | ConvertTo-Json
            Invoke-RestMethod -Uri "$Env:CommentUrl/reactions" -Headers $Headers -Body $ReactionBody -Method Post -ErrorAction Stop | Out-Null
          } Catch {
            Write-Warning "Failed to add the acknowledgment reaction. Processing will continue. Error: $($_.Exception.Message)"
          }

      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/workflow-config.json
          sparse-checkout-cone-mode: false

      # Read the repo's on-demand publishing configuration. Command detection and validation live in the shared workflow.
      - id: read
        shell: pwsh
        run: |
          $Config = (Get-Content '.github/workflow-config.json' | ConvertFrom-Json).OnDemandPublish
          "EnableAfterHoursPublish=$("$($Config.EnableAfterHoursPublish)".ToLower())" >> $Env:GITHUB_OUTPUT
          "EnableServicingPublish=$("$($Config.EnableServicingPublish)".ToLower())" >> $Env:GITHUB_OUTPUT
          "AfterHoursAuthorizedTeam=$($Config.AfterHoursAuthorizedTeam)" >> $Env:GITHUB_OUTPUT
          "ServicingAuthorizedTeam=$($Config.ServicingAuthorizedTeam)" >> $Env:GITHUB_OUTPUT
          "ServicingAuthorizedApps=$(($Config.ServicingAuthorizedApps -join ','))" >> $Env:GITHUB_OUTPUT

  # The shared workflow detects, validates, and responds to the command; this job forwards the event to it.
  # No `if:` needed - `needs: config` means this job is skipped automatically whenever the config job's gate
  # doesn't pass, so the entry conditions live in exactly one place.
  on-demand-publish:
    needs: config
    uses: MicrosoftDocs/tcp-workflows/.github/workflows/Shared-OnDemandPublish.yml@workflows-prod
    with:
        PayloadJson: ${{ toJSON(github) }}
        EnableAfterHoursPublish: ${{ fromJSON(needs.config.outputs.EnableAfterHoursPublish) }}
        EnableServicingPublish: ${{ fromJSON(needs.config.outputs.EnableServicingPublish) }}
        AfterHoursAuthorizedTeam: ${{ needs.config.outputs.AfterHoursAuthorizedTeam }}
        ServicingAuthorizedTeam: ${{ needs.config.outputs.ServicingAuthorizedTeam }}
        ServicingAuthorizedApps: ${{ needs.config.outputs.ServicingAuthorizedApps }}
    secrets:
        AccessToken: ${{ secrets.GITHUB_TOKEN }}
        PrivateKey: ${{ secrets.M365_APP_PRIVATE_KEY }}
        ClientId: ${{ secrets.M365_APP_CLIENT_ID }}
 